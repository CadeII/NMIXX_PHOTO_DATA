<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary 이미지 업로드</title>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #uploaded-image { max-width: 400px; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>이미지 업로드 (Cloudinary)</h1>
    <button id="upload-widget">이미지 선택 및 업로드</button>
    <div id="image-container"></div>
    <p>업로드된 이미지 링크를 콘솔이나 사용하세요.</p>

    <script>
        const myWidget = cloudinary.createUploadWidget({
            cloudName: 'dy0wgnlma',  // 실제 Cloud Name 입력
            uploadPreset: 'Cadell',  // Unsigned preset 이름 입력
            sources: ['local', 'url', 'camera'],  // 로컬, URL, 카메라 지원
            multiple: false,  // 단일 업로드
            maxFiles: 5,
            clientAllowedFormats: ['jpg', 'png', 'gif', 'webp']
        }, (error, result) => {
            if (!error && result && result.event === 'success') {
                const imageUrl = result.info.secure_url;
                console.log('업로드된 이미지 URL:', imageUrl);  // 링크 복사 가능
                
                // 이미지 미리보기 표시
                const imgElement = document.createElement('img');
                imgElement.src = imageUrl;
                imgElement.alt = '업로드된 이미지';
                imgElement.id = 'uploaded-image';
                imgElement.style.maxWidth = '400px';
                imgElement.style.marginTop = '20px';
                document.getElementById('image-container').innerHTML = '';
                document.getElementById('image-container').appendChild(imgElement);
            }
        });

        document.getElementById('upload-widget').addEventListener('click', () => {
            myWidget.open();
        }, false);
    </script>
</body>
</html>
